[project]
name = "dokdok"
version = "0.1.0"
description = "Structured documents, written by agents, rendered as real Word/PDF files."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dokdok = "dokdok.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dokdok"]
