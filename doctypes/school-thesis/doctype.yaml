# Example doctype: a vocational-school thesis (fictional guideline), English.
name: school-thesis
title: School thesis (example)
lang: en
title_page: sections/title.md

sections:
  - id: introduction
    title: Introduction
    required: true
    words: { min: 300, max: 450 }
    subsections: [Topic and personal motivation, Aim and research questions, Approach and methods]
    hint: |
      Finish this last. Graded on: personal motivation, clearly stated research questions,
      at least two methods. 300–450 words.
  - id: main-part
    title: Main part
    required: true
    words: { min: 2000 }
    hint: |
      One ## per research question. Every claim from research needs a citation [@id].
      Direct quotes in “quotation marks”, at most one sixth of the text.
  - id: conclusion
    title: Conclusion
    required: true
    subsections: [Answers to the research questions, Personal reflection]
    hint: Answer each research question in a few sentences, then reflect on what you learned.
  - id: references
    title: References
    generated: sources
  - id: appendix
    title: Appendix
    required: true
    subsections: [Declaration of authorship]
    hint: Required by the guideline. Missing declaration costs points.
  - id: ai-log
    title: AI usage log
    generated: ai-log

checks:
  - every_citation_resolves
  - every_source_cited
  - every_figure_has_caption
  - no_placeholders_in_final

targets:
  default: { format: docx }
  web: { format: html }
